<div class="page">

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <label for="username">Usuario</label>
    <input id="username" aria-describedby="usernameError" formControlName="username">
    @if (usernameError()) {
    <p role="alert" id="usernameError">{{ usernameError() }}</p>
    }
    <label for="password">Contraseña</label>
    <input id="password" type="password" aria-describedby="passwordError" formControlName="password">
    @if (passwordError()) {
    <p role="alert" id="passwordError">{{ passwordError() }}</p>
    }
    @if (loginError) {
    <p role="alert">{{ loginError }}</p>
    }

    <button type="submit" [disabled]="isLoading">
      @if (isLoading) {
      <img class="loading" src="/loading.gif" alt="" />
      <span role="status">Iniciando sesión...</span>
      } @else {
      <span>Iniciar sesión</span>
      }
    </button>
    </form>
</div>
